[project]
name = "freight-tiger-smart-cost-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yoshita-22", email = "mittayoshita22@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
    "git-filter-repo>=2.47.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "sentence-transformers==3.4.1",
    "transformers==4.46.3",
]

[project.scripts]
freight-tiger-smart-cost-assistant = "freight_tiger_smart_cost_assistant:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
